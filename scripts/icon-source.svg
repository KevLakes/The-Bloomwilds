<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8EA"/>
      <stop offset="100%" stop-color="#E8F5D6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.2" r="0.55">
      <stop offset="0%" stop-color="#FFE9A3" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFE9A3" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#glow)"/>

  <!-- Big leaf -->
  <g transform="translate(96 96) rotate(-12)">
    <path d="M0 160 C 0 60, 80 0, 180 0 C 280 0, 320 80, 320 160 C 220 220, 80 220, 0 160 Z"
          fill="#69C04E"/>
    <path d="M20 150 L 280 30"
          stroke="rgba(255,255,255,0.55)"
          stroke-width="10"
          stroke-linecap="round"/>
    <!-- Small darker leaf overlay -->
    <path d="M40 152 C 40 84, 100 36, 180 36 C 240 36, 280 80, 280 144 C 220 184, 100 192, 40 152 Z"
          fill="rgba(46, 52, 64, 0.08)"/>
  </g>

  <!-- Flower top-right -->
  <g transform="translate(380 110)">
    <g>
      <ellipse cx="0" cy="-26" rx="16" ry="22" fill="#F4A6C0"/>
      <ellipse cx="0" cy="-26" rx="16" ry="22" fill="#F4A6C0" transform="rotate(72)"/>
      <ellipse cx="0" cy="-26" rx="16" ry="22" fill="#F4A6C0" transform="rotate(144)"/>
      <ellipse cx="0" cy="-26" rx="16" ry="22" fill="#F4A6C0" transform="rotate(216)"/>
      <ellipse cx="0" cy="-26" rx="16" ry="22" fill="#F4A6C0" transform="rotate(288)"/>
    </g>
    <circle cx="0" cy="0" r="12" fill="#F9D77E"/>
  </g>

  <!-- Sparkles -->
  <g fill="#F9D77E">
    <path d="M120 380 L128 410 L158 418 L128 426 L120 456 L112 426 L82 418 L112 410 Z"/>
    <path d="M420 380 L426 400 L446 406 L426 412 L420 432 L414 412 L394 406 L414 400 Z"/>
  </g>
</svg>
